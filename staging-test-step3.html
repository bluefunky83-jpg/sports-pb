<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>staging 3단계 390×844 검증 (임시 검수 페이지)</title>
  <style>
    body { font-family: monospace; background: #0f172a; color: #e2e8f0; padding: 12px; margin: 0; }
    h2 { font-size: 14px; }
    pre { white-space: pre-wrap; word-break: break-all; font-size: 12px; background: #111827; padding: 10px; border-radius: 8px; }
    .frame-wrap { width: 390px; height: 844px; border: 2px solid #38bdf8; overflow: hidden; }
    .frame-wrap iframe { width: 390px; height: 844px; border: 0; display: block; }
    #phaseB { display: none; }
  </style>
</head>
<body>
  <h2>선수 성장노트 staging 3단계 · 390×844 실제 CSS 가로 넘침 / JS 오류 / 사진 UI 검증</h2>
  <pre id="out">실행 중...</pre>
  <div class="frame-wrap" id="phaseA"><iframe id="err-frame" width="390" height="844" title="staging app (error capture)"></iframe></div>
  <div class="frame-wrap" id="phaseB"><iframe id="real-frame" width="390" height="844" title="staging app (real css)"></iframe></div>
  <script>
    const OUT = document.getElementById('out');
    const lines = [];
    function say(msg) { lines.push(msg); OUT.textContent = lines.join('\n'); }
    const APP = 'staging/index.html?t=' + Date.now();

    // ---------- Phase A: 코드 그대로를 doc.write로 주입해 JS 오류만 수집 ----------
    const errFrame = document.getElementById('err-frame');
    fetch(APP, { cache: 'no-store' })
      .then(r => r.text())
      .then(html => {
        const collector = `<script>
window.__errs = [];
window.addEventListener('error', function (e) { window.__errs.push('error: ' + (e.message || e)); });
window.addEventListener('unhandledrejection', function (e) {
  window.__errs.push('unhandledrejection: ' + ((e.reason && (e.reason.message || e.reason)) || 'unknown'));
});
(function () {
  var orig = console.error;
  console.error = function () {
    try { window.__errs.push('console.error: ' + Array.prototype.slice.call(arguments).map(String).join(' ')); } catch (err) {}
    orig.apply(console, arguments);
  };
})();
<\\/script>`;
        const injected = html.replace('<head>', '<head>\n' + collector);
        const doc = errFrame.contentDocument;
        doc.open(); doc.write(injected); doc.close();

        setTimeout(function () {
          const w = errFrame.contentWindow;
          const errs = (w.__errs || []);
          say('[A1] JavaScript 오류 ' + errs.length + '건 => ' + (errs.length === 0 ? 'PASS' : 'FAIL'));
          errs.slice(0, 10).forEach(e => say('   ! ' + e));
          say('[A2] 앱 상태: ' + (function () { try { return w.eval("Object.keys(appData).map(k => k + '=' + appData[k].length).join(',') + ' / players=' + playersData.length"); } catch (e) { return '? ' + e.message; } })());
          document.getElementById('phaseA').style.display = 'none';
          startPhaseB();
        }, 2600);
      })
      .catch(err => { say('staging/index.html 로드 실패: ' + err); startPhaseB(); });

    // ---------- Phase B: 실제 CSS가 적용되는 src iframe에서 390×844 레이아웃 측정 ----------
    function startPhaseB() {
      document.getElementById('phaseB').style.display = 'block';
      const frame = document.getElementById('real-frame');
      frame.src = APP + '&real=1';
      frame.addEventListener('load', function onLoad() {
        frame.removeEventListener('load', onLoad);
        const doc = frame.contentDocument, w = frame.contentWindow;
        setTimeout(function () {
          say('URL: ' + (w.location.href || '(none)'));
          say('로그인 상태: ' + (w.localStorage.getItem('STAGING_ATHLETE_APP_AUTH_USER') ? '있음' : '없음'));
          say('기록 건수: ' + (function () { try { return w.eval("Object.keys(appData).map(k => k + '=' + appData[k].length).join(',') + ' / players=' + playersData.length"); } catch (e) { return '? ' + e.message; } })());
          say('사진 UI 노드 수: ' + doc.querySelectorAll('[id*="photo"], [id*="Photo"]').length + ' => ' + (doc.querySelectorAll('[id*="photo"], [id*="Photo"]').length === 0 ? 'PASS 없음' : 'FAIL 남음'));
          overflowReport('[B1] 초기 화면');

          try { w.openAddEditPlayerModal('yusin'); } catch (e) { say('openAddEditPlayerModal 오류: ' + e.message); }
          setTimeout(function () {
            const modal = doc.getElementById('modal-player-form');
            const modalText = modal ? modal.textContent : '';
            say('[B2] 프로필 수정 모달 사진 문구(사진 선택/선수 프로필 사진): ' + ((modalText.includes('사진 선택') || modalText.includes('선수 프로필 사진')) ? 'FAIL 남음' : 'PASS 없음'));
            const sel = doc.getElementById('form-player-event');
            say('[B3] 주종목 옵션(유신): ' + Array.from(sel.options).map(o => o.value).join(', ') + ' / 선택값=' + sel.value);
            overflowReport('[B4] 선수 프로필 수정 모달');

            try { w.closeAddEditPlayerModal(); } catch (e) {}
            try { w.openRecordModal(); } catch (e) { say('openRecordModal 오류: ' + e.message); }
            setTimeout(function () {
              const recModal = doc.getElementById('modal-record');
              say('[B5] 기록 모달 표시: ' + (recModal && !recModal.classList.contains('hidden') ? '열림' : '닫힘'));
              overflowReport('[B6] 기록 추가 모달');
              try { w.closeRecordModal(); } catch (e) {}
              try { w.openAddEditPlayerModal('yusin'); } catch (e) {}
              say('DONE');
            }, 400);
          }, 400);
        }, 1200);
      });
    }

    function overflowReport(label) {
      const frame = document.getElementById('real-frame');
      const doc = frame.contentDocument, w = frame.contentWindow;
      const d = doc.documentElement;
      const b = doc.body;
      const cw = d.clientWidth;
      const sw = Math.max(d.scrollWidth, b ? b.scrollWidth : 0);
      const frameW = frame.getBoundingClientRect().width;
      const bad = [];
      const all = doc.querySelectorAll('body *');
      for (let i = 0; i < all.length; i++) {
        const el = all[i];
        const st = w.getComputedStyle(el);
        if (st.display === 'none' || st.visibility === 'hidden' || el.getClientRects().length === 0) continue;
        const r = el.getBoundingClientRect();
        if (r.width === 0 && r.height === 0) continue;
        const right = r.right + w.scrollX;
        const left = r.left + w.scrollX;
        if (right > cw + 1 || left < -1) {
          bad.push((el.id ? '#' + el.id : el.tagName.toLowerCase()) + ' [' + Math.round(left) + '~' + Math.round(right) + '] ' + (el.className && typeof el.className === 'string' ? el.className.split(' ').slice(0, 3).join('.') : ''));
        }
      }
      say(label + ' | frame=' + Math.round(frameW) + 'px clientWidth=' + cw + ' scrollWidth=' + sw + ' => ' + (sw <= cw && Math.round(frameW) <= 390 ? 'PASS 가로넘침 0' : 'FAIL 가로넘침 ' + (sw - cw) + 'px'));
      say('   넘치는 요소 ' + bad.length + '개' + (bad.length ? ':\n   - ' + bad.slice(0, 8).join('\n   - ') : ''));
    }
  </script>
</body>
</html>
