<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Step5 390x844 verification</title>
<style>
  body { margin: 0; background: #0b1120; color: #e2e8f0; font: 12px/1.5 monospace; }
  #out { padding: 8px; white-space: pre-wrap; }
  #wrap { width: 390px; height: 844px; overflow: hidden; border: 1px solid #334155; margin: 8px; background: #020617; }
  iframe { width: 390px; height: 844px; border: 0; display: block; }
</style>
</head>
<body>
<div id="out">RUNNING</div>
<div id="wrap"><iframe id="frame" src="./staging/index.html?v=mobile-step5"></iframe></div>
<script>
  var log = [];
  var outEl = document.getElementById('out');
  function report() { outEl.textContent = log.join('\n'); }
  function say(s) { log.push(s); report(); }
  var errors = [];

  var frame = document.getElementById('frame');
  frame.onload = function () {
    var win = frame.contentWindow;
    var doc = frame.contentDocument;
    win.addEventListener('error', function (e) {
      errors.push('iframe-error: ' + e.message + ' @' + (e.filename || '') + ':' + e.lineno);
    });
    win.addEventListener('unhandledrejection', function (e) {
      errors.push('iframe-rejection: ' + (e.reason && (e.reason.message || e.reason)));
    });

    function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

    function measure(tag) {
      var de = doc.documentElement;
      var vw = 390;
      var rows = [];
      doc.querySelectorAll('body *').forEach(function (el) {
        var r = el.getBoundingClientRect();
        if (r.width === 0 && r.height === 0) return;
        if (r.right > vw + 0.5 || r.left < -0.5) {
          var p = el.parentElement;
          var inScroll = false;
          while (p) {
            var st = win.getComputedStyle(p);
            if (st.overflowX === 'auto' || st.overflowX === 'scroll') { inScroll = true; break; }
            p = p.parentElement;
          }
          rows.push({
            tag: el.tagName.toLowerCase() + '[' + String(el.className || '').slice(0, 46) + ']',
            left: Math.round(r.left), right: Math.round(r.right), inScroll: inScroll
          });
        }
      });
      var real = rows.filter(function (x) { return !x.inScroll; });
      say(tag + ' | scrollWidth=' + de.scrollWidth + ' clientWidth=' + de.clientWidth +
          ' bodyScrollWidth=' + doc.body.scrollWidth + ' | 넘침후보=' + real.length +
          ' (스크롤영역 내부 ' + (rows.length - real.length) + ')');
      real.slice(0, 10).forEach(function (x) {
        say('   OVERFLOW ' + x.tag + ' L' + x.left + ' R' + x.right);
      });
    }

    async function run() {
      await sleep(1500);
      say('title=' + doc.title);
      var gate = doc.getElementById('gate-login-screen');
      say('login gate visible=' + (gate ? !gate.classList.contains('hidden') : 'n/a'));
      say('currentPlayer=' + win.currentPlayer + ' | players=' + (win.playersData || []).map(function (p) { return p.id; }).join(','));
      say('records yusin=' + (win.appData && win.appData.yusin ? win.appData.yusin.length : '?') +
          ' byeolha=' + (win.appData && win.appData.byeolha ? win.appData.byeolha.length : '?'));
      measure('PB view (유신)');

      win.setMainViewMode('ANNUAL');
      await sleep(500);
      measure('연간 2026 유신');
      say('annual cards=' + win.document.querySelectorAll('#view-container .p-4.rounded-2xl').length);

      win.stepAnnualYear(-1);
      await sleep(350);
      measure('연간 2025 유신');

      win.stepAnnualYear(-1);
      win.stepAnnualYear(-1);
      await sleep(350);
      measure('연간 2023 유신(빈 해)');

      win.switchPlayer('byeolha');
      await sleep(400);
      win.annualYear = 2026;
      win.renderCurrentView();
      await sleep(400);
      measure('연간 2026 별하');

      win.setMainViewMode('PB');
      await sleep(350);
      measure('PB view (별하)');

      win.switchPlayer('yusin');
      await sleep(350);
      measure('PB view (유신 복귀)');

      // 이미지 생성(캔버스) 크기 확인 — 다운로드 없이 캔버스만 만들어 본다
      var pbCanvas = win.buildCaptureCanvas('PB');
      var annualCanvas = win.buildCaptureCanvas('ANNUAL');
      say('canvas PB=' + pbCanvas.canvas.width + 'x' + pbCanvas.canvas.height + ' (css h=' + pbCanvas.height + ')');
      say('canvas ANNUAL=' + annualCanvas.canvas.width + 'x' + annualCanvas.canvas.height + ' (css h=' + annualCanvas.height + ')');

      say('JS_ERRORS=' + errors.length);
      errors.slice(0, 10).forEach(function (e) { say('   ' + e); });
      say('DONE');
    }
    run();
  };
</script>
</body>
</html>
