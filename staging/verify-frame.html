<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>staging 화면 크기 검수용 프레임</title>
<style>
  body { margin: 0; background: #111827; color: #e5e7eb; font-family: system-ui, sans-serif; }
  .row { display: flex; gap: 16px; align-items: flex-start; padding: 12px; }
  .frame { background: #000; }
  .frame iframe { border: 0; display: block; background: #020617; }
  .label { font: 12px/1.4 system-ui; padding: 4px 2px; color: #93c5fd; }
</style>
</head>
<body>
<div id="host"></div>
<script>
  var params = new URLSearchParams(location.search);
  var scale = params.get('scale') || '1.0';
  try { localStorage.setItem('STAGING_ATHLETE_APP_UI_SCALE', scale); } catch (e) {}
  var sizes = [['모바일 390x844', 390, 844], ['태블릿 768x1024', 768, 1024], ['PC 1440x900', 1440, 900]];
  var host = document.getElementById('host');
  sizes.forEach(function (s) {
    var row = document.createElement('div'); row.className = 'row';
    var wrap = document.createElement('div');
    var label = document.createElement('div'); label.className = 'label'; label.textContent = s[0] + ' · 배율 ' + scale;
    var frame = document.createElement('div'); frame.className = 'frame'; frame.style.width = s[1] + 'px'; frame.style.height = s[2] + 'px';
    var iframe = document.createElement('iframe'); iframe.width = s[1]; iframe.height = s[2];
    iframe.src = './index.html?embed=1&scale=' + scale;
    frame.appendChild(iframe); wrap.appendChild(label); wrap.appendChild(frame); row.appendChild(wrap); host.appendChild(row);
  });
</script>
</body>
</html>
