<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>size frame</title>
<style>html,body{margin:0;background:#020617}iframe{border:0;display:block;background:#020617}</style>
</head>
<body>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var w = parseInt(q.get('w') || '390', 10);
  var h = parseInt(q.get('h') || (w >= 1000 ? 900 : 844), 10);
  var f = document.createElement('iframe');
  f.src = './index.html?v=frame-' + w;
  f.width = w; f.height = h;
  document.body.appendChild(f);
})();
</script>
</body>
</html>
