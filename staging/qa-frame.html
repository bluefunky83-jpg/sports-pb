<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>QA frame (temporary)</title>
  <style>
    html, body { margin: 0; background: #111827; font-family: system-ui, sans-serif; }
    .row { display: flex; gap: 12px; padding: 12px; align-items: flex-start; }
    .box { background: #1f2937; border: 1px solid #374151; border-radius: 8px; overflow: hidden; }
    .cap { color: #9ca3af; font-size: 11px; padding: 4px 8px; }
    iframe { border: 0; display: block; background: #020617; }
  </style>
</head>
<body>
  <div class="row">
    <div class="box">
      <div class="cap">mobile 390 x 844</div>
      <iframe id="m390" src="./preview-final.html" width="390" height="844"></iframe>
    </div>
    <div class="box">
      <div class="cap">desktop 1440 x 900</div>
      <iframe id="d1440" src="./preview-final.html" width="1440" height="900"></iframe>
    </div>
  </div>
</body>
</html>
