<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>QA3 harness</title>
<style>
  html, body { margin: 0; background: #0b0f19; color: #e2e8f0; font: 12px/1.5 ui-monospace, monospace; }
  #wrap { display: flex; align-items: flex-start; gap: 8px; padding: 8px; }
  #frame { border: 1px solid #334155; background: #020617; flex: 0 0 auto; display: block; }
  #out { flex: 1 1 auto; white-space: pre-wrap; word-break: break-all; max-height: 96vh; overflow: auto; margin: 0; padding: 8px; background: #111827; border: 1px solid #1f2937; }
  #go { position: fixed; right: 12px; bottom: 12px; z-index: 9; padding: 8px 14px; font: inherit; }
</style>
</head>
<body>
<button id="go" type="button">start</button>
<div id="wrap"><pre id="out">ready</pre></div>
<script>
const q = new URLSearchParams(location.search);
const out = document.getElementById('out');
let frame = null;
const WIDTH = +(q.get('w') || 390), HEIGHT = +(q.get('h') || 844), SCALE = q.get('scale') || '';
function log(o) { out.textContent = 'RESULT: ' + (typeof o === 'string' ? o : JSON.stringify(o)); }
function W() { return frame.contentWindow; }
function D() { return frame.contentDocument; }
function waitMs(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function tabBtn(id) { return D().querySelector('#event-tabs-container button[data-tab-id="' + String(id).replace(/"/g, '\\"') + '"]'); }
function tabs() { return Array.from(D().querySelectorAll('#event-tabs-container button')).map(function (b) { return b.getAttribute('data-tab-id'); }); }
function activeTab() { const b = D().querySelector('#event-tabs-container button.bg-blue-600'); return b ? b.getAttribute('data-tab-id') : '(none)'; }
function playerOptions() { const s = D().getElementById('select-player'); return s ? Array.from(s.options).map(function (o) { return { id: o.value, label: o.textContent.trim() }; }) : []; }
function switchPlayerById(id) { const s = D().getElementById('select-player'); if (!s) return false; s.value = id; s.dispatchEvent(new (W().Event)('change', { bubbles: true })); return true; }
function recordSelectInfo() { const s = D().getElementById('form-record-event'); return s ? { selected: s.value, options: Array.from(s.options).map(function (o) { return o.value; }) } : null; }
function loginAs(email, role) { const w = W(); w.alert = function () {}; w.confirm = function () { return true; }; w.fillStagingTestAccount(email, role || 'admin'); w.handleEmailPasswordLogin(null); return waitMs(1100); }
function isSuperUi() { const b = D().getElementById('btn-super-admin-top'); return !!b && !b.classList.contains('hidden'); }
function rect(el) { const b = el.getBoundingClientRect(); return { top: Math.round(b.top), bottom: Math.round(b.bottom), h: Math.round(b.height), w: Math.round(b.width) }; }

function start() {
  if (frame) return;
  frame = document.createElement('iframe');
  frame.id = 'frame';
  frame.style.width = WIDTH + 'px';
  frame.style.height = HEIGHT + 'px';
  document.getElementById('wrap').insertBefore(frame, out);
  if (SCALE) { try { localStorage.setItem('STAGING_ATHLETE_APP_UI_SCALE', SCALE); } catch (e) {} }
  frame.addEventListener('load', function () {
    setTimeout(function () {
      const run = q.get('run') || '';
      const fn = window['run_' + run];
      if (!fn) { log('no run: ' + run); return; }
      Promise.resolve(fn()).then(function (r) { if (r !== undefined) log(r); }).catch(function (e) { log({ error: String((e && e.stack) || e) }); });
    }, 800);
  });
  frame.src = 'index.html?qa3=1&cb=' + Date.now();
}
document.getElementById('go').addEventListener('click', start);

/* ---------- 스와이프 ---------- */
function fire(target, type, x, y) {
  const w = W();
  const t = new w.Touch({ identifier: 1, target: target, clientX: x, clientY: y });
  const list = (type === 'touchend' || type === 'touchcancel') ? [] : [t];
  target.dispatchEvent(new w.TouchEvent(type, { bubbles: true, cancelable: true, touches: list, targetTouches: list, changedTouches: [t] }));
}
function swipe(target, dx, dy, opts) {
  opts = opts || {};
  const x0 = (opts.x0 === undefined) ? 180 : opts.x0, y0 = (opts.y0 === undefined) ? 300 : opts.y0;
  fire(target, 'touchstart', x0, y0);
  if (!opts.noMove) fire(target, 'touchmove', x0 + dx * 0.5, y0 + dy * 0.5);
  fire(target, 'touchend', x0 + dx, y0 + dy);
}
window.run_swipe = function () {
  const w = W(), d = D(), res = [];
  const y = playerOptions().find(function (p) { return String(p.label).indexOf('김유신') >= 0; });
  if (y) switchPlayerById(y.id);
  const snap = function (label) { res.push(label + ' => ' + activeTab()); };
  const body = d.getElementById('view-container');
  const order = tabs();
  w.selectEventTab(order[0]);
  snap('start');
  swipe(body, -120, 4); snap('left');
  swipe(body, -120, 4); snap('left2');
  swipe(body, 120, 4); snap('right');
  w.selectEventTab(order[0]); swipe(body, 120, 4); snap('right@first(no move)');
  w.selectEventTab(order[order.length - 1]); swipe(body, -120, 4); snap('left@last(no move)');
  w.selectEventTab(order[0]); swipe(body, 10, 160); snap('vertical(no move)');
  swipe(body, 120, 150); snap('diagonal(no move)');
  swipe(body, -40, 2); snap('short40(no move)');
  swipe(body, -120, 2, { x0: 4 }); snap('edge(no move)');
  swipe(d.getElementById('event-tabs-container'), -120, 2); snap('tabbar(no move)');
  w.selectEventTab(order[1]); snap('set ' + order[1]);
  const canvas = d.querySelector('#view-container canvas');
  if (canvas) { swipe(canvas, -120, 2); snap('canvas(no move)'); }
  w.openSettingsModal();
  swipe(body, -120, 2); snap('modal open(no move)');
  w.closeSettingsModal();
  w.selectEventTab(order[order.length - 1]);
  const lastScroll = Math.round(d.getElementById('event-tabs-container').scrollLeft);
  res.push('lastTabScrollLeft=' + lastScroll);
  return res;
};

/* ---------- 종목 탭 자동 노출 ---------- */
window.run_tabscroll = function () {
  const w = W(), d = D(), res = [];
  const y = playerOptions().find(function (p) { return String(p.label).indexOf('김유신') >= 0; });
  if (y) switchPlayerById(y.id);
  const c = d.getElementById('event-tabs-container');
  tabs().forEach(function (id) {
    w.selectEventTab(id);
    const btn = tabBtn(id), cl = c.scrollLeft, cw = c.clientWidth;
    const left = btn.offsetLeft - c.offsetLeft, right = left + btn.offsetWidth;
    res.push(id + ': visible=' + (left >= cl - 1 && right <= cl + cw + 1) + ' (' + Math.round(left) + '~' + Math.round(right) + ' / view ' + Math.round(cl) + '~' + Math.round(cl + cw) + ')');
  });
  return res;
};

/* ---------- 종합 점검 ---------- */
window.run_all = function () {
  const w = W(), d = D(), res = {};
  const VH = w.innerHeight;
  return Promise.resolve(isSuperUi() ? null : loginAs('super@test.local')).then(function () {
    return waitMs(500);
  }).then(function () {
    // 2) 기본 종목
    const y = playerOptions().find(function (p) { return String(p.label).indexOf('김유신') >= 0; });
    if (y) switchPlayerById(y.id);
    const m = [];
    tabs().forEach(function (t) { tabBtn(t).click(); w.openRecordModal(); const i = recordSelectInfo(); m.push(t + '→' + i.selected); w.closeRecordModal(); });
    res.defaultEvent_김유신 = m;
    const b = playerOptions().find(function (p) { return String(p.label).indexOf('별하') >= 0; });
    if (b) {
      switchPlayerById(b.id);
      const m2 = [];
      tabs().forEach(function (t) { tabBtn(t).click(); w.openRecordModal(); const i = recordSelectInfo(); m2.push(t + '→' + i.selected + '(' + i.options.join(',') + ')'); w.closeRecordModal(); });
      res.defaultEvent_김별하 = m2;
      switchPlayerById(y.id);
    }
    // 9/10/13) 최고관리자 센터
    return w.openSuperAdminModal();
  }).then(function () {
    const sc = d.getElementById('modal-super-admin-center');
    const panel = sc.querySelector('.modal-panel');
    const card = d.getElementById('sa-super-card');
    const list = d.getElementById('sa-viewers-tree-container');
    const header = sc.querySelector('.modal-fixed');
    const ht = Math.round(header.getBoundingClientRect().top);
    res.superCenter = {
      panel: rect(panel), vh: VH, inside: rect(panel).top >= -1 && rect(panel).bottom <= VH + 1,
      cardLines: Array.from(card.children).map(function (c) { return c.textContent.trim(); }),
      cardPad: getComputedStyle(card).padding,
      adminCardPad: (list.querySelector(':scope > div') ? getComputedStyle(list.querySelector(':scope > div')).padding : null),
      cardFonts: Array.from(card.children).map(function (c) { return getComputedStyle(c).fontSize; }),
      adminCardFonts: list.querySelector(':scope > div') ? Array.from(list.querySelector(':scope > div').children).map(function (c) { return getComputedStyle(c).fontSize; }) : null,
      logout: Array.from(sc.querySelectorAll('button')).filter(function (b) { return (b.textContent || '').indexOf('로그아웃') >= 0; }).length,
      closeFullWidth: (function () { const btn = sc.querySelector('.modal-fixed:last-child button'); return Math.abs(btn.getBoundingClientRect().width - (panel.getBoundingClientRect().width - 40)) < 3; })(),
      megaIcon: (function () { const box = d.getElementById('sa-notice-icon'), svg = box.querySelector('svg'), t = d.getElementById('sa-notice-text'); return { box: rect(box), svg: rect(svg), textH: Math.round(t.getBoundingClientRect().height) }; })(),
      listScrollable: list.scrollHeight > list.clientHeight
    };
    w.closeSuperAdminModal();
    // 12/13) 관리자 센터
    w.openAdminProfileModal();
    const ac = d.getElementById('modal-admin-profile');
    const r0 = { defaultClosed: !d.getElementById('admin-my-players-body').classList.contains('is-open') && !d.getElementById('admin-approved-viewers-body').classList.contains('is-open') };
    w.toggleAdminCenterAccordion('players'); w.toggleAdminCenterAccordion('viewers');
    const p = ac.querySelector('.modal-panel');
    res.adminCenter = Object.assign(r0, {
      bothOpen: d.getElementById('admin-my-players-body').classList.contains('is-open') && d.getElementById('admin-approved-viewers-body').classList.contains('is-open'),
      panel: rect(p), inside: rect(p).top >= -1 && rect(p).bottom <= VH + 1,
      titles: [d.getElementById('admin-my-players-title').textContent, d.getElementById('admin-approved-viewers-title').textContent],
      logout: Array.from(ac.querySelectorAll('button')).filter(function (b) { return (b.textContent || '').indexOf('로그아웃') >= 0; }).length,
      closeOnlyAtBottom: (function () { const f = ac.querySelector('.modal-panel > div:last-child'); return f.querySelectorAll('button').length === 1; })(),
      searchBoxes: [!!d.getElementById('admin-my-players-search'), !!d.getElementById('admin-approved-viewers-search')]
    });
    w.closeAdminProfileModal();
    return loginAs('coach_a@test.local', 'admin');
  }).then(function () {
    return waitMs(700);
  }).then(function () {
    try { w.seedStagingDummy50(); } catch (e) {}
    return waitMs(800);
  }).then(function () {
    // 15/14) 50명 명단
    w.openPlayerManageModal();
    const scroller = d.querySelector('#modal-players [data-scroll-key="player-manage"]');
    const header = d.querySelector('#modal-players .modal-fixed');
    const footer = d.querySelector('#modal-players .modal-panel > div:last-child');
    const ht = Math.round(header.getBoundingClientRect().top);
    scroller.scrollTop = 700;
    const cards = Array.from(d.querySelectorAll('#player-cards-container > div'));
    res.playerList = {
      count: d.getElementById('player-list-count').textContent,
      scroll: scroller.clientHeight + '/' + scroller.scrollHeight,
      headerFixed: Math.round(header.getBoundingClientRect().top) === ht,
      footerVisible: footer.getBoundingClientRect().bottom <= VH + 1,
      deletedHiddenWhenNone: d.getElementById('deleted-players-accordion').classList.contains('hidden'),
      cards: cards.length
    };
    scroller.scrollTop = 620;
    const keep = scroller.scrollTop;
    const editBtn = cards[26] ? cards[26].querySelector('button[title="프로필 수정"]') : null;
    if (editBtn) {
      editBtn.click();
      w.closeAddEditPlayerModal();
      res.playerList.editReturn = { before: Math.round(keep), after: Math.round(scroller.scrollTop), kept: Math.abs(scroller.scrollTop - keep) <= 2, listOpen: !d.getElementById('modal-players').classList.contains('hidden') };
    }
    w.closePlayerManageModal();
    // 4) 잠금 문구
    w.openPlayerManageModal();
    const card = d.querySelector('#player-cards-container > div');
    const lockBtn = card.querySelector('button[title="프로필 잠금"], button[title="프로필 잠금 해제"]');
    const mm = String(lockBtn.getAttribute('onclick')).match(/'([^']+)'/);
    const pid = mm[1];
    w.togglePlayerLock(pid); const t1 = d.getElementById('sync-status-toast').textContent;
    w.togglePlayerLock(pid); const t2 = d.getElementById('sync-status-toast').textContent;
    res.lockMessages = [t1, t2];
    w.closePlayerManageModal();
    // 6) 알림 하단
    w.openViewerApprovalModal();
    const modal = d.getElementById('modal-viewer-approvals');
    const pane = d.getElementById('approval-list-container');
    res.notif = { hasGgangtong: (modal.textContent || '').indexOf('깡통') >= 0, paneIsLast: pane.parentElement.lastElementChild === pane, gap: Math.round(pane.parentElement.getBoundingClientRect().bottom - pane.getBoundingClientRect().bottom) };
    w.closeViewerApprovalModal();
    return res;
  });
};

/* ---------- 화면 고정(스크린샷) ---------- */
window.run_shot = function () {
  const w = W();
  const login = q.get('login') || '';
  const role = q.get('role') || 'admin';
  const player = q.get('player') || '';
  const tab = q.get('tab') || '';
  const open = q.get('open') || '';
  const ready = login ? loginAs(login, role) : waitMs(200);
  return ready.then(function () {
    if (player) { const o = playerOptions().find(function (p) { return String(p.label).indexOf(player) >= 0; }); if (o) switchPlayerById(o.id); }
    return waitMs(600);
  }).then(function () {
    if (tab) { const b = tabBtn(tab); if (b) b.click(); }
    return waitMs(500);
  }).then(function () {
    if (tab && activeTab() !== tab) { const b = tabBtn(tab); if (b) b.click(); }
    return waitMs(400);
  }).then(function () {
    if (open === 'players') { w.openPlayerManageModal(); if (q.get('bulk') === '1') w.enterPlayerBulkMode(); }
    else if (open === 'admincenter') { w.openAdminProfileModal(); return waitMs(400).then(function () { w.toggleAdminCenterAccordion('players'); w.toggleAdminCenterAccordion('viewers'); }); }
    else if (open === 'super') { return w.openSuperAdminModal(); }
    else if (open === 'record') { w.openRecordModal(); }
    else if (open === 'notif') { w.openViewerApprovalModal(); }
    else if (open === 'notice') { w.openNoticeAdminModal(); }
    return waitMs(200);
  }).then(function () { log('shot ready: ' + activeTab() + ' / ' + open); });
};
</script>
</body>
</html>
