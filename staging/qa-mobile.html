<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>staging 모바일 검수 하네스</title>
<style>
  html, body { margin: 0; background: #1e293b; font-family: -apple-system, "Malgun Gothic", sans-serif; }
  #bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px; color: #e2e8f0; font-size: 12px; position: sticky; top: 0; background: #0f172a; z-index: 5; }
  #bar button { padding: 4px 8px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; font-size: 11px; cursor: pointer; }
  #bar button.on { background: #2563eb; border-color: #3b82f6; color: #fff; }
  #wrap { display: flex; gap: 12px; align-items: flex-start; padding: 8px; }
  #frame { width: 390px; height: 844px; border: 1px solid #475569; background: #020617; flex: 0 0 auto; }
  #out { flex: 1 1 auto; min-width: 320px; max-height: 830px; overflow: auto; color: #cbd5e1; font: 11px/1.5 ui-monospace, monospace; white-space: pre-wrap; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 8px; }
</style>
</head>
<body>
<div id="bar">
  <b>390×844 검수 하네스</b>
  <button onclick="zoom('1')">100%</button>
  <button onclick="zoom('1.1')">110%</button>
  <button onclick="zoom('1.2')">120%</button>
  <button onclick="zoom('1.3')">130%</button>
  <button onclick="kb(true)">키보드 시뮬 ON</button>
  <button onclick="kb(false)">키보드 시뮬 OFF</button>
  <button onclick="measure()">측정</button>
  <button onclick="openModal()">기록창 열기</button>
</div>
<div id="wrap">
  <iframe id="frame" src="./index.html"></iframe>
  <pre id="out">준비됨.</pre>
</div>
<script>
  const frame = document.getElementById('frame');
  const out = document.getElementById('out');
  function w() { return frame.contentWindow; }
  function d() { return frame.contentDocument; }
  function log(o) { out.textContent = typeof o === 'string' ? o : JSON.stringify(o, null, 2); }

  function zoom(z) {
    try { w().setUiScale(z); log('배율 ' + z + ' 적용'); } catch (e) { log('zoom err: ' + e.message); }
  }
  function kb(on) {
    try {
      const doc = d();
      if (on) {
        doc.documentElement.style.setProperty('--app-vh', '420px');
        doc.documentElement.style.setProperty('--app-vv-top', '0px');
        doc.body.classList.add('kb-open');
        log('키보드 시뮬레이션 ON (보이는 높이 420px 가정)');
      } else {
        w().syncAppViewportHeight(true);
        doc.body.classList.remove('kb-open');
        log('키보드 시뮬레이션 OFF');
      }
    } catch (e) { log('kb err: ' + e.message); }
  }
  function openModal() {
    try { w().openRecordModal(); log('기록 모달 열기 호출'); } catch (e) { log('open err: ' + e.message); }
  }
  function rect(el) {
    if (!el) return null;
    const r = el.getBoundingClientRect();
    return { top: Math.round(r.top), bottom: Math.round(r.bottom), left: Math.round(r.left), right: Math.round(r.right), w: Math.round(r.width), h: Math.round(r.height) };
  }
  function measure() {
    try {
      const doc = d(), win = w();
      const q = s => doc.querySelector(s);
      const panel = q('#modal-record .modal-panel');
      const footer = q('#modal-record .modal-fixed.px-5.py-4.border-t');
      const header = q('#modal-record > div > .modal-fixed');
      const date = q('#input-date');
      const meet = q('#input-meet');
      const rank = q('#input-rank');
      const round = q('#input-meet-round');
      const hint = q('#modal-record .text-\\[9px\\].text-slate-500');
      const btnAdd = q('#modal-record button[onclick="saveRecord(true)"]');
      const btnSave = q('#modal-record button[type="submit"]');
      const res = {
        배율: doc.documentElement.style.zoom || '1',
        보이는높이_innerHeight: win.innerHeight,
        가로스크롤: { scrollW: doc.scrollingElement.scrollWidth, innerW: win.innerWidth },
        모달열림: panel ? !panel.closest('.modal-overlay').classList.contains('hidden') : null,
        패널: rect(panel),
        헤더: rect(header),
        하단버튼영역: rect(footer),
        패널_아래가_화면안: panel ? Math.round(panel.getBoundingClientRect().bottom) <= win.innerHeight + 1 : null,
        날짜칸: date ? { ...rect(date), scrollW: date.scrollWidth, clientW: date.clientWidth, 잘림: date.scrollWidth > date.clientWidth + 1 } : null,
        대회명칸: meet ? { ...rect(meet), scrollW: meet.scrollWidth, clientW: meet.clientWidth, 잘림: meet.scrollWidth > meet.clientWidth + 1 } : null,
        회차칸: round ? { ...rect(round), 폭: Math.round(round.getBoundingClientRect().width) } : null,
        순위칸: rank ? { value: rank.value, placeholder: rank.placeholder } : null,
        안내문구: hint ? { text: hint.textContent.trim(), left: Math.round(hint.getBoundingClientRect().left) } : null,
        추가버튼: btnAdd ? { text: btnAdd.innerText.trim(), h: Math.round(btnAdd.getBoundingClientRect().height), wrap: btnAdd.getBoundingClientRect().height > 52 } : null,
        저장버튼: btnSave ? { text: btnSave.innerText.trim(), h: Math.round(btnSave.getBoundingClientRect().height) } : null,
        bodyClass: doc.body.className
      };
      log(res);
    } catch (e) { log('measure err: ' + e.message + '\n' + e.stack); }
  }
</script>
</body>
</html>
