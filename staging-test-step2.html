<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>staging 2단계 390×844 검증 (임시 검수 페이지)</title>
  <style>
    body { font-family: monospace; background: #0f172a; color: #e2e8f0; padding: 12px; margin: 0; }
    h2 { font-size: 14px; }
    pre { white-space: pre-wrap; word-break: break-all; font-size: 12px; background: #111827; padding: 10px; border-radius: 8px; }
    #frame-wrap { width: 405px; height: 859px; border: 0; overflow: hidden; }
    iframe { width: 405px; height: 859px; border: 0; display: block; }
  </style>
</head>
<body>
  <h2>선수 성장노트 staging 2단계 · 390×844 가로 넘침 / JS 오류 검증</h2>
  <pre id="out">실행 중...</pre>
  <div id="frame-wrap"><iframe id="app-frame" width="405" height="859" title="staging app"></iframe></div>
  <script>
    const OUT = document.getElementById('out');
    const lines = [];
    function say(msg) { lines.push(msg); OUT.textContent = lines.join('\n'); }

    const frame = document.getElementById('app-frame');

    fetch('staging/index.html?t=' + Date.now(), { cache: 'no-store' })
      .then(r => r.text())
      .then(html => {
        const collector = `<script>
window.__errs = [];
window.addEventListener('error', function (e) { window.__errs.push('error: ' + (e.message || e)); });
window.addEventListener('unhandledrejection', function (e) {
  window.__errs.push('unhandledrejection: ' + ((e.reason && (e.reason.message || e.reason)) || 'unknown'));
});
(function () {
  var orig = console.error;
  console.error = function () {
    try { window.__errs.push('console.error: ' + Array.prototype.slice.call(arguments).map(String).join(' ')); } catch (err) {}
    orig.apply(console, arguments);
  };
})();
<\/script>`;

        const injected = html.replace('<head>', '<head>\n' + collector);
        const doc = frame.contentDocument;
        doc.open();
        doc.write(injected);
        doc.close();

        const w = frame.contentWindow;

        function overflowReport(label) {
          const d = doc.documentElement;
          const b = doc.body;
          const cw = d.clientWidth;
          const sw = Math.max(d.scrollWidth, b ? b.scrollWidth : 0);
          const bad = [];
          const all = doc.querySelectorAll('body *');
          const insideScroller = (el) => {
            let n = el.parentElement;
            while (n && n !== doc.body) {
              const st = w.getComputedStyle(n);
              if (st.overflowX === 'auto' || st.overflowX === 'scroll' || st.overflowX === 'hidden') return true;
              n = n.parentElement;
            }
            return false;
          };
          for (let i = 0; i < all.length; i++) {
            const el = all[i];
            const st = w.getComputedStyle(el);
            if (st.display === 'none' || st.visibility === 'hidden' || el.getClientRects().length === 0) continue;
            const r = el.getBoundingClientRect();
            if (r.width === 0 && r.height === 0) continue;
            const right = r.right + w.scrollX;
            const left = r.left + w.scrollX;
            if ((right > cw + 1 || left < -1) && !insideScroller(el)) {
              bad.push((el.id ? '#' + el.id : el.tagName.toLowerCase()) + ' [' + Math.round(left) + '~' + Math.round(right) + '] ' + (el.className && typeof el.className === 'string' ? el.className.split(' ').slice(0, 3).join('.') : ''));
            }
          }
          say(label + ' | viewport=' + d.clientWidth + 'x' + d.clientHeight + ' scrollWidth=' + sw + ' clientWidth=' + cw + ' => ' + (sw <= cw ? 'PASS 가로넘침 0' : 'FAIL 가로넘침 ' + (sw - cw) + 'px'));
          say('   넘치는 요소 ' + bad.length + '개' + (bad.length ? ':\n   - ' + bad.slice(0, 8).join('\n   - ') : ''));
          return { sw: sw, cw: cw, bad: bad };
        }

        function errors() {
          const e = w.__errs || [];
          return e;
        }

        setTimeout(function () {
          say('URL: ' + (w.location.href || '(about:srcdoc)'));
          say('로그인 상태: ' + (w.localStorage.getItem('STAGING_ATHLETE_APP_AUTH_USER') ? '있음' : '없음'));
          say('선수 목록: ' + (w.playersData || []).map(p => p.name + ' / ' + p.sport + ' / ' + p.mainEvent).join(' | '));
          overflowReport('[1] 초기 화면');

          // 개인·단체 아코디언 두 장 동시 펼침
          try {
            w.openAddEditPlayerModal('yusin');
          } catch (e) { say('openAddEditPlayerModal 오류: ' + e.message); }
          setTimeout(function () {
            const pBody = doc.getElementById('acc-body-personal');
            const tBody = doc.getElementById('acc-body-team');
            const tBtn = doc.getElementById('acc-header-team');
            if (tBtn && tBody.classList.contains('hidden')) tBtn.click();
            say('[2] 아코디언 상태 개인=' + (pBody.classList.contains('hidden') ? '닫힘' : '열림') + ' 단체=' + (tBody.classList.contains('hidden') ? '닫힘' : '열림') + ' => ' + ((!pBody.classList.contains('hidden') && !tBody.classList.contains('hidden')) ? 'PASS 동시 펼침' : 'FAIL 동시 펼침 안됨'));
            const sel = doc.getElementById('form-player-event');
            say('[3] 주종목 옵션(유신): ' + Array.from(sel.options).map(o => o.value).join(', ') + ' / 선택값=' + sel.value);
            const notice = doc.getElementById('main-event-notice');
            say('[4] 안내문: ' + (notice.classList.contains('hidden') ? '(숨김)' : notice.textContent));
            say('[5] 개인 카드 칩 ' + doc.querySelectorAll('#chips-personal > *').length + '개 / 단체 카드 칩 ' + doc.querySelectorAll('#chips-team > *').length + '개');
            overflowReport('[6] 선수 프로필 수정 모달(아코디언 모두 펼침)');

            // 새 선수 등록 모달
            try { w.closeAddEditPlayerModal(); w.openAddEditPlayerModal(); } catch (e) { say('새 선수 등록 모달 오류: ' + e.message); }
            setTimeout(function () {
              const sel2 = doc.getElementById('form-player-event');
              say('[7] 새 선수 등록 주종목 옵션: ' + Array.from(sel2.options).map(o => o.value).join(', ') + ' / 선택값=' + sel2.value);
              overflowReport('[8] 새 선수 등록 모달');
              try { w.closeAddEditPlayerModal(); } catch (e) {}

              const errs = errors();
              say('[9] JavaScript 오류 ' + errs.length + '건 => ' + (errs.length === 0 ? 'PASS' : 'FAIL'));
              errs.slice(0, 10).forEach(e => say('   ! ' + e));
              say('DONE');
            }, 400);
          }, 500);
        }, 2500);
      })
      .catch(err => say('staging/index.html 로드 실패: ' + err));
  </script>
</body>
</html>
