<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>1단계 데이터 손실 방지 실브라우저 검증 (격리 환경)</title>
</head>
<body style="font-family: monospace; padding: 20px; background: #0f172a; color: #e2e8f0;">
  <h2>선수 성장노트 1단계 격리 브라우저 검증</h2>
  <pre id="test-output">테스트 대기 중...</pre>
  <script>
    // Completely isolated storage keys (never touch production keys)
    const TEST_STORAGE_KEY = 'TEST_STEP1_RECORDS';
    const TEST_PLAYERS_KEY = 'TEST_STEP1_PLAYERS';
    const TEST_TEAMMATES_KEY = 'TEST_STEP1_TEAMMATES';
    const TEST_BACKUP_SINGLE = 'TEST_STEP1_PRE_RESTORE_BACKUP';
    const TEST_BACKUP_HIST = 'TEST_STEP1_PRE_RESTORE_BACKUPS';

    let testAppData = {};
    let testPlayersData = [];
    let testSavedTeammates = [];
    let consoleErrors = [];
    let lastAlerts = [];

    const origConsoleError = console.error;
    console.error = (...args) => {
      consoleErrors.push(args.map(a => String(a)).join(' '));
      origConsoleError.apply(console, args);
    };

    function testSaveToStorage(storageObj = localStorage) {
      try {
        storageObj.setItem(TEST_STORAGE_KEY, JSON.stringify(testAppData));
        storageObj.setItem(TEST_PLAYERS_KEY, JSON.stringify(testPlayersData));
        storageObj.setItem(TEST_TEAMMATES_KEY, JSON.stringify(testSavedTeammates));
        return true;
      } catch (e) {
        console.error('testSaveToStorage error:', e.message || e);
        return false;
      }
    }

    function validateBackupJson(parsed) {
      if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
        return { ok: false, reason: 'JSON 최상위 구조가 올바른 객체가 아닙니다.' };
      }
      if (!parsed.appData || typeof parsed.appData !== 'object' || Array.isArray(parsed.appData)) {
        return { ok: false, reason: '필수 항목(appData)이 없거나 형식이 올바르지 않습니다.' };
      }
      if (!Array.isArray(parsed.playersData)) {
        return { ok: false, reason: '필수 항목(playersData)이 없거나 배열 형식이 아닙니다.' };
      }
      for (let i = 0; i < parsed.playersData.length; i++) {
        const p = parsed.playersData[i];
        if (!p || typeof p !== 'object' || !p.id || !p.name) {
          return { ok: false, reason: `선수 정보(${i + 1}번째 항목)에 필수값(id, name)이 누락되었습니다.` };
        }
      }
      for (const pid of Object.keys(parsed.appData)) {
        const recs = parsed.appData[pid];
        if (!Array.isArray(recs)) {
          return { ok: false, reason: `선수 기록(${pid}) 형식이 배열이 아닙니다.` };
        }
        for (let j = 0; j < recs.length; j++) {
          const r = recs[j];
          if (!r || typeof r !== 'object' || (!r.event && !r.date)) {
            return { ok: false, reason: `기록 데이터(${pid}의 ${j + 1}번째 항목)가 손상되었습니다.` };
          }
        }
      }
      if (parsed.savedTeammates !== undefined && !Array.isArray(parsed.savedTeammates)) {
        return { ok: false, reason: '팀원 목록(savedTeammates) 형식이 올바르지 않습니다.' };
      }
      return { ok: true };
    }

    function runImportLogic(rawJsonText, options = {}) {
      const storageObj = options.storageObj || localStorage;
      const confirmFn = options.confirmFn || (() => true);
      const alertFn = (msg) => lastAlerts.push(msg);
      const forceRenderError = !!options.forceRenderError;

      const prevAppData = JSON.parse(JSON.stringify(testAppData || {}));
      const prevPlayersData = JSON.parse(JSON.stringify(testPlayersData || []));
      const prevSavedTeammates = JSON.parse(JSON.stringify(testSavedTeammates || []));

      try {
        const parsed = JSON.parse(rawJsonText);
        const check = validateBackupJson(parsed);
        if (!check.ok) {
          alertFn(`복원을 진행할 수 없습니다.\n사유: ${check.reason}`);
          return { status: 'blocked', reason: check.reason };
        }

        const okConfirm = confirmFn(parsed);
        if (!okConfirm) {
          return { status: 'cancelled' };
        }

        try {
          const backupEntry = {
            savedAt: new Date().toISOString(),
            appData: prevAppData,
            playersData: prevPlayersData,
            savedTeammates: prevSavedTeammates
          };
          let historyList = [];
          try {
            const rawHist = storageObj.getItem(TEST_BACKUP_HIST);
            if (rawHist) {
              const parsedHist = JSON.parse(rawHist);
              if (Array.isArray(parsedHist)) historyList = parsedHist;
            }
          } catch (e) {}
          historyList.unshift(backupEntry);
          if (historyList.length > 3) historyList = historyList.slice(0, 3);
          while (historyList.length > 0) {
            try {
              storageObj.setItem(TEST_BACKUP_HIST, JSON.stringify(historyList));
              break;
            } catch (quotaErr) {
              historyList.pop();
            }
          }
          storageObj.setItem(TEST_BACKUP_SINGLE, JSON.stringify(backupEntry));
        } catch (backupErr) {}

        testAppData = parsed.appData;
        testPlayersData = parsed.playersData;
        if (parsed.savedTeammates !== undefined) testSavedTeammates = parsed.savedTeammates;

        const savedOk = testSaveToStorage(storageObj);
        if (!savedOk) {
          throw new Error('브라우저 저장소 용량이 초과되어 데이터를 저장할 수 없습니다.');
        }
        if (forceRenderError) {
          throw new Error('강제 렌더링 오류 테스트');
        }
        alertFn('데이터를 성공적으로 복원했습니다!');
        return { status: 'success' };
      } catch (err) {
        testAppData = prevAppData;
        testPlayersData = prevPlayersData;
        testSavedTeammates = prevSavedTeammates;
        let rollbackSaved = testSaveToStorage(storageObj);
        if (!rollbackSaved) {
          try {
            storageObj.removeItem(TEST_BACKUP_SINGLE);
            storageObj.removeItem(TEST_BACKUP_HIST);
          } catch (e) {}
          rollbackSaved = testSaveToStorage(storageObj);
        }
        const msg = rollbackSaved
          ? '복원 중 오류가 발생하여 기존 데이터를 안전하게 복구·유지했습니다.'
          : '복원 및 저장소 재저장 모두 실패했으나 현재 메모리상의 기존 데이터는 유지됩니다. 즉시 JSON 백업을 다운로드해 주세요.';
        alertFn(msg);
        return { status: 'rolled_back', rollbackSaved, message: msg, error: err.message };
      }
    }

    function runAllBrowserTests() {
      const results = {};
      // Clean isolated keys first
      [TEST_STORAGE_KEY, TEST_PLAYERS_KEY, TEST_TEAMMATES_KEY, TEST_BACKUP_SINGLE, TEST_BACKUP_HIST].forEach(k => localStorage.removeItem(k));
      consoleErrors = [];
      lastAlerts = [];

      // Seed initial synthetic data
      testPlayersData = [{ id: 'tp_0', name: '가상선수0', sport: '육상', mainEvent: '단거리' }];
      testAppData = { tp_0: [{ id: 'tr_0', date: '2026-01-01', event: '100m', seconds: 12.0, kind: '공식' }] };
      testSavedTeammates = ['가상팀원A'];
      testSaveToStorage();

      // Test 1 & 4: Legacy v1 backup JSON compatibility + export filename check
      const legacyPayload = JSON.stringify({
        appData: { tp_legacy: [{ id: 'tr_leg', date: '2025-05-10', event: '200m', seconds: 24.5, kind: '공식' }] },
        playersData: [{ id: 'tp_legacy', name: '가상구버전' }],
        exportedAt: '2026-10-30T10:00:00.000Z'
      });
      const rLegacy = runImportLogic(legacyPayload);
      const preBackupRaw = localStorage.getItem(TEST_BACKUP_SINGLE);
      const preBackupParsed = preBackupRaw ? JSON.parse(preBackupRaw) : null;
      const backupRestorable = !!(preBackupParsed && validateBackupJson(preBackupParsed).ok && preBackupParsed.playersData[0].id === 'tp_0');
      results.test1_temp_backup_restorable = backupRestorable ? '성공' : '실패';
      results.test4_legacy_compat = (rLegacy.status === 'success' && testPlayersData[0].id === 'tp_legacy') ? '성공' : '실패';

      // Test 2: 4 consecutive restores -> keep latest 3 backups
      for (let i = 1; i <= 3; i++) {
        runImportLogic(JSON.stringify({
          appData: { [`tp_${i}`]: [{ id: `tr_${i}`, date: `2026-02-0${i}`, event: '100m', seconds: 11.5 + i * 0.1 }] },
          playersData: [{ id: `tp_${i}`, name: `가상선수${i}` }],
          savedTeammates: []
        }));
      }
      const histRaw = localStorage.getItem(TEST_BACKUP_HIST);
      const histArr = histRaw ? JSON.parse(histRaw) : [];
      const histIds = histArr.map(h => h.playersData[0].id);
      // After total 4 restores (legacy + 1,2,3), history must hold latest 3 snapshots: tp_2, tp_1, tp_legacy
      results.test2_4x_restore_keeps_3 = (histArr.length === 3 && histIds.join(',') === 'tp_2,tp_1,tp_legacy') ? '성공' : '실패';
      results.test2_detail = histIds;

      // Test 3a: localStorage QuotaExceededError during restore -> rollback succeeds
      let quotaMode = 'fail_large_only';
      const mockStorage = {
        store: {
          [TEST_STORAGE_KEY]: localStorage.getItem(TEST_STORAGE_KEY),
          [TEST_PLAYERS_KEY]: localStorage.getItem(TEST_PLAYERS_KEY),
          [TEST_TEAMMATES_KEY]: localStorage.getItem(TEST_TEAMMATES_KEY),
          [TEST_BACKUP_HIST]: localStorage.getItem(TEST_BACKUP_HIST),
          [TEST_BACKUP_SINGLE]: localStorage.getItem(TEST_BACKUP_SINGLE),
        },
        getItem(k) { return this.store[k] ?? null; },
        removeItem(k) { delete this.store[k]; },
        setItem(k, v) {
          if (quotaMode === 'fail_large_only' && v.includes('BIG_QUOTA_PAYLOAD')) {
            throw new DOMException('QuotaExceededError', 'QuotaExceededError');
          }
          if (quotaMode === 'fail_all') {
            throw new DOMException('QuotaExceededError', 'QuotaExceededError');
          }
          this.store[k] = String(v);
        }
      };
      const rQuota = runImportLogic(JSON.stringify({
        appData: { tp_big: [{ id: 'tr_big', date: '2026-03-01', event: '100m', note: 'BIG_QUOTA_PAYLOAD' }] },
        playersData: [{ id: 'tp_big', name: '대용량가상' }]
      }), { storageObj: mockStorage });
      results.test3_quota_rollback = (rQuota.status === 'rolled_back' && rQuota.rollbackSaved === true && testPlayersData[0].id === 'tp_3') ? '성공' : '실패';

      // Test 3b: Rollback itself also fails -> memory preserved + clear warning message
      quotaMode = 'fail_all';
      const rDoubleFail = runImportLogic(JSON.stringify({
        appData: { tp_fail2: [{ id: 'tr_f2', date: '2026-03-02', event: '100m' }] },
        playersData: [{ id: 'tp_fail2', name: '이중실패가상' }]
      }), { storageObj: mockStorage });
      results.test3b_rollback_fail_safeguard = (rDoubleFail.status === 'rolled_back' && rDoubleFail.rollbackSaved === false && testPlayersData[0].id === 'tp_3' && rDoubleFail.message.includes('메모리상의 기존 데이터는 유지')) ? '성공' : '실패';

      // Test 5: Forced runtime error during restore -> rollback
      const rForceErr = runImportLogic(JSON.stringify({
        appData: { tp_err: [{ id: 'tr_err', date: '2026-03-03', event: '100m' }] },
        playersData: [{ id: 'tp_err', name: '오류가상' }]
      }), { forceRenderError: true });
      results.test5_forced_error_rollback = (rForceErr.status === 'rolled_back' && testPlayersData[0].id === 'tp_3') ? '성공' : '실패';

      // Test 6: Cancelled restore -> zero change
      const beforeCancel = JSON.stringify({ testAppData, testPlayersData, testSavedTeammates });
      const rCancel = runImportLogic(legacyPayload, { confirmFn: () => false });
      const afterCancel = JSON.stringify({ testAppData, testPlayersData, testSavedTeammates });
      results.test6_cancel_no_change = (rCancel.status === 'cancelled' && beforeCancel === afterCancel) ? '성공' : '실패';

      // Test 7: Corrupt JSON & wrong schema blocked
      const rBadSyntax = runImportLogic('{bad json!!!');
      const rWrongSchema = runImportLogic(JSON.stringify({ hello: 'world' }));
      const rCorruptRec = runImportLogic(JSON.stringify({ appData: { p1: [{}] }, playersData: [{ id: 'p1', name: 'A' }] }));
      results.test7_corrupt_blocked = (rBadSyntax.status === 'rolled_back' && rWrongSchema.status === 'blocked' && rCorruptRec.status === 'blocked' && testPlayersData[0].id === 'tp_3') ? '성공' : '실패';

      // Clean isolated keys after test
      [TEST_STORAGE_KEY, TEST_PLAYERS_KEY, TEST_TEAMMATES_KEY, TEST_BACKUP_SINGLE, TEST_BACKUP_HIST].forEach(k => localStorage.removeItem(k));

      // Expected QuotaExceededError console.error from mock test is tracked separately
      results.consoleErrorsCount = consoleErrors.length;
      results.consoleErrors = consoleErrors;
      window.__STEP1_TEST_RESULTS__ = results;
      document.getElementById('test-output').textContent = JSON.stringify(results, null, 2);
      return results;
    }

    runAllBrowserTests();
  </script>
</body>
</html>
