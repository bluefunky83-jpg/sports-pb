<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>staging 5-1 모바일 검수 (390×844)</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #111827; color: #e5e7eb; }
  #wrap { display: flex; gap: 16px; padding: 12px; align-items: flex-start; }
  #frame-wrap { width: 405px; height: 844px; flex: 0 0 auto; border: 1px solid #4b5563; background: #020617; overflow: hidden; }
  iframe { width: 405px; height: 844px; border: 0; display: block; }
  #panel { width: 520px; font-size: 12px; line-height: 1.5; }
  #panel h1 { font-size: 14px; margin: 0 0 8px; }
  #report { white-space: pre-wrap; background: #1f2937; border: 1px solid #374151; padding: 10px; border-radius: 8px; }
  button { background: #2563eb; color: white; border: 0; padding: 6px 12px; border-radius: 6px; cursor: pointer; margin-bottom: 8px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="frame-wrap"><iframe id="app-frame" src="about:blank" width="405" height="844"></iframe></div>
  <div id="panel">
    <h1>390×844 검수 (iframe 폭 405 = 390 + 스크롤바 15)</h1>
    <button type="button" onclick="refresh()">측정</button>
    <div id="report">로딩 중…</div>
    <div style="margin-top:10px;color:#9ca3af">앱 프레임을 직접 조작한 뒤 [측정]을 누르면 현재 화면의 가로 넘침·JS 오류를 보여 줍니다.</div>
  </div>
</div>
<script>
  var frame = document.getElementById('app-frame');
  var errors = [];
  var version = new URLSearchParams(location.search).get('v') || '1';
  frame.src = 'staging/?v=' + encodeURIComponent(version);

  function attachErrorCollectors() {
    try {
      var w = frame.contentWindow;
      if (!w || w.__collectorAttached) return;
      w.__collectorAttached = true;
      try {
        var d = frame.contentDocument;
        var st = d.createElement('style');
        st.textContent = 'html{overflow-y:scroll !important}';
        (d.head || d.documentElement).appendChild(st);
      } catch (e2) {}
      w.addEventListener('error', function (e) {
        errors.push('error: ' + (e.message || e.error || 'unknown') + ' @' + (e.filename || '') + ':' + (e.lineno || ''));
      });
      w.addEventListener('unhandledrejection', function (e) {
        errors.push('unhandledrejection: ' + (e.reason && (e.reason.message || e.reason) || 'unknown'));
      });
      var origErr = w.console.error;
      w.console.error = function () {
        errors.push('console.error: ' + Array.prototype.slice.call(arguments).map(String).join(' '));
        return origErr.apply(w.console, arguments);
      };
    } catch (e) {
      errors.push('collector attach failed: ' + e.message);
    }
  }

  function refresh() {
    var out = [];
    try {
      var w = frame.contentWindow;
      var d = frame.contentDocument;
      var de = d.documentElement;
      var vw = de.clientWidth;
      var over = [];
      function clippedByScroller(el) {
        var p = el.parentElement;
        while (p && p !== d.body) {
          var ox = getComputedStyle(p).overflowX;
          if (ox === 'auto' || ox === 'scroll' || ox === 'hidden') return true;
          p = p.parentElement;
        }
        return false;
      }
      Array.prototype.forEach.call(d.querySelectorAll('body *'), function (el) {
        var r = el.getBoundingClientRect();
        if (r.width <= 0 || r.height <= 0) return;
        if (getComputedStyle(el).position === 'fixed') return;
        if (clippedByScroller(el)) return;
        if (r.right > vw + 1 || r.left < -1) {
          over.push((el.id ? '#' + el.id : el.tagName.toLowerCase()) + ' [' + Math.round(r.left) + '~' + Math.round(r.right) + '] ' + (el.className && String(el.className).slice(0, 40)));
        }
      });
      out.push('layout=' + vw + 'x' + de.clientHeight + '  window=' + w.innerWidth + 'x' + w.innerHeight + '  scrollWidth=' + de.scrollWidth + '  clientWidth=' + de.clientWidth);
      out.push('가로 넘침 요소: ' + over.length + '개');
      over.slice(0, 8).forEach(function (s) { out.push('  - ' + s); });
      out.push('JS 오류: ' + errors.length + '건');
      errors.slice(0, 8).forEach(function (s) { out.push('  - ' + s); });
      out.push('화면: ' + (d.querySelector('#custom-player-dropdown-label') ? d.querySelector('#custom-player-dropdown-label').textContent : '') + ' / ' + (d.querySelector('#event-tabs-container .bg-blue-600') ? d.querySelector('#event-tabs-container .bg-blue-600').textContent : ''));
    } catch (e) {
      out.push('측정 실패: ' + e.message);
    }
    document.getElementById('report').textContent = out.join('\n');
  }

  frame.addEventListener('load', function () {
    attachErrorCollectors();
    setTimeout(refresh, 700);
  });
  setTimeout(function () { attachErrorCollectors(); refresh(); }, 1500);
</script>
</body>
</html>
